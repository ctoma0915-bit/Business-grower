<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1416'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-weight='700' font-size='34' text-anchor='middle' fill='%23fff'%3ET%3C/text%3E%3C/svg%3E">
<!-- artifact:start -->
<title>Toma Outreach Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
/* Layout: a working desk. Sticky bar with tabs on top. "Today" is a send queue: one large prospect card on the left, progress and "up next" on the right. Brand tokens match the landing page: near-white ground, one teal accent, Geist. Platform colours only mark where a message goes. */
:root{
  --bg:#f6f8f7; --alt:#edf1f0; --surface:#ffffff;
  --ink:#0b1416; --ink-2:#2b3538; --muted:#5b6669; --faint:#879195;
  --line:#e3e8e7; --line-2:#d2dad8;
  --accent:#0a7f6f; --accent-hover:#086c5e; --on-accent:#ffffff;
  --accent-soft:#e3f3ef; --accent-line:#b8ded5;
  --hot:#b4490f; --hot-soft:#fcefe5;
  --warn:#866000; --warn-soft:#faf2d9;
  --danger:#b4382a; --danger-soft:#fbebe8;
  --wa:#0f8a47; --wa-soft:#e4f4ea;
  --ig:#b0236c; --ig-soft:#fae8f1;
  --fb:#1660d0; --fb-soft:#e7effc;
  --tt:#0b1416; --tt-soft:#e9eded;
  --glass:rgba(246,248,247,.86);
  --scrim:rgba(5,10,11,.45);
  --shadow-sm:0 1px 2px rgba(11,20,22,.05);
  --shadow:0 1px 2px rgba(11,20,22,.04),0 14px 36px -16px rgba(11,20,22,.18);
  --f-sans:Geist,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f10; --alt:#121a1c; --surface:#131b1d;
  --ink:#edf2f1; --ink-2:#cbd4d3; --muted:#909c9e; --faint:#69767b;
  --line:#1f2a2c; --line-2:#2c383a;
  --accent:#35d0b6; --accent-hover:#62dcc7; --on-accent:#04201b;
  --accent-soft:#0f2925; --accent-line:#1f4b43;
  --hot:#ffad7a; --hot-soft:#2e1b10;
  --warn:#e8c25a; --warn-soft:#2a2410;
  --danger:#ff8a78; --danger-soft:#2d1512;
  --wa:#4fd98c; --wa-soft:#10261a;
  --ig:#f47ab6; --ig-soft:#2b1221;
  --fb:#79acff; --fb-soft:#111f36;
  --tt:#edf2f1; --tt-soft:#1d2729;
  --glass:rgba(10,15,16,.84);
  --scrim:rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 18px 44px -18px rgba(0,0,0,.75);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f10; --alt:#121a1c; --surface:#131b1d;
  --ink:#edf2f1; --ink-2:#cbd4d3; --muted:#909c9e; --faint:#69767b;
  --line:#1f2a2c; --line-2:#2c383a;
  --accent:#35d0b6; --accent-hover:#62dcc7; --on-accent:#04201b;
  --accent-soft:#0f2925; --accent-line:#1f4b43;
  --hot:#ffad7a; --hot-soft:#2e1b10;
  --warn:#e8c25a; --warn-soft:#2a2410;
  --danger:#ff8a78; --danger-soft:#2d1512;
  --wa:#4fd98c; --wa-soft:#10261a;
  --ig:#f47ab6; --ig-soft:#2b1221;
  --fb:#79acff; --fb-soft:#111f36;
  --tt:#edf2f1; --tt-soft:#1d2729;
  --glass:rgba(10,15,16,.84);
  --scrim:rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 18px 44px -18px rgba(0,0,0,.75);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3{margin:0;color:var(--ink);text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::selection{background:var(--accent-soft);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;padding:.72em 1.15em;border-radius:11px;border:1px solid transparent;background:var(--accent);color:var(--on-accent);font:600 14.5px/1.2 var(--f-sans);text-decoration:none;cursor:pointer;white-space:nowrap;transition:background-color .2s,transform .2s var(--ease),border-color .2s}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:translateY(1px)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed;transform:none}
.btn-lg{font-size:16px;padding:.85em 1.35em;border-radius:12px}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn-ghost:hover{background:var(--alt)}
.btn-quiet{background:transparent;color:var(--ink-2);border-color:transparent;padding-inline:.8em}
.btn-quiet:hover{background:var(--alt)}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--line-2)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
kbd{font:500 11px/1 var(--f-mono);padding:3px 5px;border-radius:5px;border:1px solid currentColor;opacity:.6}
.linkish{border:0;background:none;padding:0;color:var(--accent);font-weight:550;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.linkish:hover{color:var(--accent-hover)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(1.5) blur(12px);backdrop-filter:saturate(1.5) blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.02em;font-size:16px;white-space:nowrap}
.logo-mark{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
.logo span{color:var(--muted);font-weight:500}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:550;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tab:hover{background:var(--alt);color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tab .n{font:600 11px/1 var(--f-mono);padding:3px 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tab[aria-current="page"] .n{background:var(--accent);color:var(--on-accent)}
.sync{font-size:12.5px;color:var(--muted);display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.cloud::before{background:var(--accent)}
.sync.err::before{background:var(--danger)}
@media (max-width:760px){
  .top-in{flex-wrap:wrap;gap:6px 12px;padding-block:10px 6px}
  .tabs{order:3;flex-basis:100%;margin-inline:-6px}
  .sync{margin-left:auto}
}
main{padding-block:24px 110px}

/* Shared pieces */
.page-head{display:grid;gap:6px;margin-bottom:20px}
.page-head h1{font-size:clamp(24px,2.2vw + 14px,32px);letter-spacing:-.03em;font-weight:650;line-height:1.15}
.lede{color:var(--muted);max-width:64ch}
.eyebrow{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:grid;gap:16px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,2.4vw,24px);display:grid;gap:14px;min-width:0}
.block-h{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:620;letter-spacing:-.015em}
.block-h .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 12px/1 var(--f-mono)}
.block-sub{color:var(--muted);font-size:14px;margin-top:-6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field>label,.field>.lbl{font-size:13px;font-weight:550;color:var(--ink-2)}
.field small{color:var(--muted);font-size:12.5px}
.input{width:100%;border:1px solid var(--line-2);background:var(--bg);border-radius:10px;padding:9px 12px;min-height:42px;color:var(--ink)}
textarea.input{min-height:96px;resize:vertical;line-height:1.55}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:13.5px;color:var(--muted)}
.err-msg{font-size:13.5px;color:var(--danger)}
.ok-msg{font-size:13.5px;color:var(--accent)}

/* Platform + status pills */
.plat{--p:var(--faint);--ps:var(--alt);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;line-height:1;padding:5px 10px 5px 8px;border-radius:99px;background:var(--ps);color:var(--p);white-space:nowrap}
.plat::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--p)}
.p-wa{--p:var(--wa);--ps:var(--wa-soft)}
.p-ig{--p:var(--ig);--ps:var(--ig-soft)}
.p-fb{--p:var(--fb);--ps:var(--fb-soft)}
.p-tt{--p:var(--tt);--ps:var(--tt-soft)}
.pill{display:inline-flex;align-items:center;font-weight:600;font-size:12px;line-height:1;padding:5px 9px;border-radius:99px;white-space:nowrap;background:var(--alt);color:var(--ink-2)}
.fit-hot{background:var(--hot-soft);color:var(--hot)}
.fit-good{background:var(--accent-soft);color:var(--accent)}
.fit-weak{background:var(--alt);color:var(--muted)}
.fit-unrated{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line-2)}
.st-new{background:var(--alt);color:var(--ink-2)}
.st-active{background:var(--accent-soft);color:var(--accent)}
.st-done{background:var(--warn-soft);color:var(--warn)}
.st-replied{background:var(--hot-soft);color:var(--hot)}
.st-booked{background:var(--accent);color:var(--on-accent)}
.st-client{background:var(--ink);color:var(--bg)}
.st-closed{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line-2)}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:550;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--faint)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip-n{font:500 12px/1 var(--f-mono);opacity:.7}

/* Today */
.today{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:980px){.today{grid-template-columns:minmax(0,1fr)}}
.t-main{display:grid;gap:14px;min-width:0}
.t-side{display:grid;gap:14px;min-width:0}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(18px,2.8vw,28px);display:grid;gap:16px;min-width:0}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.qhead .pos{margin-left:auto;font:500 12.5px/1 var(--f-mono);color:var(--muted)}
.qstep{font-size:13.5px;color:var(--ink-2);font-weight:550}
.qstep .due{color:var(--hot)}
.qname{font-size:clamp(22px,1.6vw + 14px,28px);font-weight:650;letter-spacing:-.03em;line-height:1.15;overflow-wrap:anywhere}
.qmeta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:14px;margin-top:6px}
.qmeta b{color:var(--ink-2);font-weight:550;overflow-wrap:anywhere}
.qnote{font-size:13.5px;color:var(--muted);background:var(--alt);border-radius:10px;padding:9px 12px}
.qnote b{color:var(--ink-2);font-weight:550}
.msg{width:100%;min-height:168px;max-height:60vh;field-sizing:content;resize:vertical;border:1px solid var(--line-2);border-radius:12px;background:var(--bg);padding:14px 16px;font:400 15.5px/1.6 var(--f-sans);color:var(--ink)}
.msg:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qtools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-top:-6px}
.qtools .count{font:500 12px/1 var(--f-mono);color:var(--muted)}
.qactions{display:flex;flex-wrap:wrap;gap:10px}
.qactions .btn-lg{flex:1 1 280px}
.qactions .btn-lg kbd{border-color:currentColor}
.qsecondary{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.qsecondary .btn{font-size:13.5px;padding:.55em .85em}
.qsecondary .right{margin-left:auto}
.hint{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.hint svg{flex:none;margin-top:2px}
@media (max-width:560px){.qsecondary .right{margin-left:0}.kbd-only{display:none}}
@media (hover:none){.kbd-only{display:none}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel-h span{letter-spacing:0;text-transform:none;font:500 12px/1 var(--f-mono)}
.big{font-size:30px;font-weight:650;letter-spacing:-.03em;line-height:1}
.big small{font-size:15px;color:var(--muted);font-weight:500;letter-spacing:0}
.meter{height:8px;border-radius:99px;background:var(--alt);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .5s var(--ease)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:4px 0 0}
.kv div{display:grid;gap:2px}
.kv dt{font-size:12.5px;color:var(--muted)}
.kv dd{margin:0;font-size:18px;font-weight:620;font-variant-numeric:tabular-nums}
.spark{width:100%;height:auto;display:block}
.spark .b{fill:var(--accent-line)}
.spark .b.today{fill:var(--accent)}
.spark .base{stroke:var(--line-2);stroke-width:1}
.spark text{fill:var(--muted);font:500 9px var(--f-mono)}
.next{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.next li{min-width:0}
.next button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer;min-width:0}
.next button:hover{background:var(--alt)}
.next .dot{width:8px;height:8px;border-radius:50%;background:var(--p);flex:none}
.next .nm{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.next .sx{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tips{font-size:13.5px;color:var(--ink-2)}
.tips ul{margin:0;padding-left:18px;display:grid;gap:6px}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:14px;padding:12px 16px;font-size:14px}

.state{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3vw,32px);display:grid;gap:12px;justify-items:start}
.state h2{font-size:22px;letter-spacing:-.02em;font-weight:640}
.onboard{display:grid;gap:22px}
.onboard h1{font-size:clamp(28px,2.6vw + 16px,40px);letter-spacing:-.035em;line-height:1.08;font-weight:650;max-width:18ch}
.onboard .lede{font-size:16.5px}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:12px;counter-reset:f}
.flow li{counter-increment:f;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px;font-size:14px;color:var(--muted)}
.flow li b{color:var(--ink);font-weight:600;font-size:15px}
.flow li::before{content:counter(f);font:600 12px/1 var(--f-mono);color:var(--accent)}
.example{margin:0;border:1px dashed var(--line-2);border-radius:22px;padding:12px;background:var(--alt);display:grid;gap:10px}
.example figcaption{font-size:12.5px;color:var(--muted);padding-inline:6px}
.example .qcard{box-shadow:none}
.skeleton{height:420px;border-radius:18px;background:linear-gradient(90deg,var(--alt),var(--surface),var(--alt));background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* Find */
.sources{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:12px}
.src{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;background:var(--bg);align-content:start}
.src-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.src-h b{font-weight:620}
.src p{font-size:13.5px;color:var(--muted)}
.src a{justify-self:start;font-size:13.5px;padding:.5em .85em}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px;align-items:start}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:8px}
.sig{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg);font-size:13.5px}
.sig:has(input:checked){border-color:var(--accent-line);background:var(--accent-soft)}
.sig input{margin:3px 0 0;accent-color:var(--accent)}
.sig span{display:grid;gap:1px;min-width:0}
.sig b{font-weight:560;color:var(--ink)}
.sig small{color:var(--muted)}
.sig .w{margin-left:auto;font:600 12px/1.6 var(--f-mono);color:var(--muted)}
.result{border-radius:12px;background:var(--alt);padding:12px 14px;font-size:13.5px;display:grid;gap:4px}
.result ul{margin:4px 0 0;padding-left:18px;color:var(--muted)}

/* Prospects */
.listbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.listbar .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.listbar .input{min-height:38px;width:min(280px,100%)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:780px;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--alt);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--alt)}
td .sub{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
td .linkish{text-decoration:none;color:var(--ink);font-weight:600;text-align:left}
td .linkish:hover{text-decoration:underline}

(() => {

/* ------------------------------------------------------------------ */

const CLOSE_REASONS = { notfit: 'Not a fit', notint: 'Not interested', stop: 'Asked to stop', noreply: 'No reply' };

const DEFAULTS = {
  me: 'Toma', site: '', booking: '', cc: '1', dailyNew: 25, fu1: 3, fu2: 4,
  extra: { day: '', n: 0 },
  tpl: {
    opener: [

      'Hey {first}![[ Just saw {note}, really solid work.]] I help {businesses} get more {jobs}, and they only pay for qualified leads: real people in their area, asking for the service, with a working number. Spam and duplicates are free. Would a small test make sense for {business}?',
      'Hi {first}, {me} here. I find customers for {businesses} in {city} and get paid per qualified lead instead of a monthly fee. If a lead doesn\'t match what we agree on, you don\'t pay for it. Are you looking to book more {jobs} this season?'
    ],
    fu1: [
      'Hi {first}, bumping this in case it got buried. The idea is a small test for {business}: I send you calls and form leads from people in {city} asking for {jobs}, and you only pay for the ones that qualify. Want me to send the numbers?',
      'Hi {first}, quick follow-up. Most {businesses} I talk to are tired of paying for clicks that never call. With me you only pay when a real customer reaches out. Open to seeing what that would cost for {business}?'
    ],
    fu2: [

      'Hi {first}, I\'ll leave it here so I don\'t clutter your inbox. If you ever want more {jobs} without a retainer or a long contract, reply anytime and I\'ll put together a lead price for {business}.[[ {site}]]'
    ]
  },
  replies: [
    { label: 'They ask about price', text: 'Good question. It depends on the job and the area, so I quote a fixed price per qualified lead before we start, in writing. Can I ask three quick things: your average job value, how many leads you usually close, and your service area? Then I\'ll send you an exact number today.' },
    { label: 'They want more info', text: 'Sure. In short: I run the ads and landing pages, leads reach you through a tracked number and form, and you only pay for leads that match what we agree on. Spam, duplicates and out-of-area calls are free.[[ Here\'s how it works: {site}]] What\'s a good time for a 10-minute call this week?' },
    { label: 'They ask if it\'s legit', text: 'Fair question. I\'m {me}, and I do pay-per-lead marketing for local service businesses. There\'s no long contract, and you can see where every lead came from.[[ More here: {site}]] Happy to jump on a quick call so you can ask me anything.' },
    { label: 'They already have an agency', text: 'Makes sense. Some owners keep their agency and use me on top, since you only pay when a lead qualifies. If you ever have gaps in the schedule, I\'m one message away. Mind if I check in next season?' },
    { label: 'They say yes', text: 'Great! Let\'s do a quick 10-minute call so I can learn your service area and the jobs you want more of, and I\'ll come with a price per lead for {city}. What time works for you?[[ Or pick a slot here: {booking}]]' },
    { label: 'Not interested', text: 'No problem at all, thanks for letting me know. I won\'t message again. Good luck this season!' }
  ]
};

const EXAMPLE = {
  id: 'example', name: 'Hill Country Roofing', first: 'Mike', platform: 'ig', handle: 'hillcountryroofing', trade: 'roofing', city: 'Austin, TX',
  note: 'the metal roof you just finished in Dripping Springs', signals: ['active', 'reviews', 'owner', 'ticket'], stage: 'new', step: 0, history: []
};

/* ------------------------------------------------------------------ */
/* State                                                               */
/* ------------------------------------------------------------------ */
const state = {
  prospects: new Map(),
  settings: clone(DEFAULTS),
  mode: 'local',
  booting: hasRuntime,
  cloudLoaded: false,
  syncError: false,
  localStash: null,
  view: 'today',
  currentId: null,
  drafts: new Map(),
  platFilter: 'all',
  listFilter: 'all',
  listPlat: 'all',
  search: '',
  undo: null
};
let db = null;

function mergeSettings(s) {
  const out = clone(DEFAULTS);
  if (!s || typeof s !== 'object') return out;
  for (const k of ['me', 'site', 'booking', 'cc']) if (typeof s[k] === 'string') out[k] = s[k];
  for (const k of ['dailyNew', 'fu1', 'fu2']) if (Number.isFinite(+s[k]) && +s[k] >= 0) out[k] = +s[k];
  if (s.extra && typeof s.extra === 'object') out.extra = { day: String(s.extra.day || ''), n: +s.extra.n || 0 };
  if (s.tpl && typeof s.tpl === 'object') for (const k of STEPS) if (Array.isArray(s.tpl[k])) out.tpl[k] = s.tpl[k].map(String);
  if (Array.isArray(s.replies)) out.replies = s.replies.filter((r) => r && typeof r === 'object').map((r) => ({ label: String(r.label || ''), text: String(r.text || '') }));
  return out;
}
function normProspect(p) {
  const n = Object.assign({ name: '', first: '', platform: 'ig', handle: '', trade: 'other', city: '', note: '', notes: '', signals: [], stage: 'new', reason: '', step: 0, lastAt: null, nextAt: null, skipUntil: 0, createdAt: Date.now(), history: [] }, p);
  if (!PLATFORMS[n.platform]) n.platform = 'ig';
  if (!TRADES[n.trade]) n.trade = 'other';
  if (!Array.isArray(n.signals)) n.signals = [];
  if (!Array.isArray(n.history)) n.history = [];
  n.step = Math.max(0, Math.min(3, +n.step || 0));
  return n;
}

/* ------------------------------------------------------------------ */
/* Storage: synced database when available, this browser otherwise    */
/* ------------------------------------------------------------------ */
const Local = {
  read() { try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } },
  timer: 0,
  saveSoon() {
    if (state.mode !== 'local') return;
    clearTimeout(Local.timer);
    Local.timer = setTimeout(Local.saveNow, 150);
  },
  saveNow() {
    if (state.mode !== 'local') return;
    try { localStorage.setItem(LS_KEY, JSON.stringify({ prospects: Array.from(state.prospects.values()), settings: state.settings })); }
    catch (e) { toast('This browser would not save your list. Download a backup from Settings.'); }
  }
};
function loadUI() {
  try {
    const ui = JSON.parse(localStorage.getItem(UI_KEY) || '{}');
    if (['today', 'find', 'list', 'messages', 'settings'].includes(ui.view)) state.view = ui.view;
    if (ui.platFilter && (ui.platFilter === 'all' || PLATFORMS[ui.platFilter])) state.platFilter = ui.platFilter;
    state.ui = ui;
  } catch (e) { state.ui = {}; }
}
function saveUI(patch) {
  state.ui = Object.assign(state.ui || {}, { view: state.view, platFilter: state.platFilter }, patch || {});
  try { localStorage.setItem(UI_KEY, JSON.stringify(state.ui)); } catch (e) {}
}

// Cloud writes: one write at a time per document, at most 4 in flight.
const chains = new Map();
const pendingLocal = new Map();
let inFlight = 0;
const waiters = [];
function acquireSlot() { if (inFlight < 4) { inFlight++; return Promise.resolve(); } return new Promise((r) => waiters.push(r)); }
function releaseSlot() { const w = waiters.shift(); if (w) w(); else inFlight--; }
async function withRetry(fn) {
  try { return await fn(); }
  catch (e) { if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 800); return fn(); } throw e; }
}
function onWriteError(e) {
  const code = e && e.code;
  if (code === 'quota_exceeded') toast('Your synced list is full. Delete closed prospects in Prospects, then try again.');
  else if (code === 'invalid_argument') toast('This copy is read-only, so the change was not saved.');
  else toast('A change did not sync. Check your connection; it will retry on your next edit.');
}
function cloudWrite(key, value, fn) {
  pendingLocal.set(key, value);
  const prev = chains.get(key) || Promise.resolve();
  const next = prev.then(async () => {
    await acquireSlot();
    try { await withRetry(fn); } catch (e) { onWriteError(e); } finally { releaseSlot(); }
  });
  chains.set(key, next);
  next.then(() => { if (chains.get(key) === next) { chains.delete(key); pendingLocal.delete(key); } });
  return next;
}
function bodyOf(p) { const b = clone(p); delete b.id; return b; }
function persist(p) {
  state.prospects.set(p.id, p);
  if (state.mode === 'cloud' && db) { const body = bodyOf(p); cloudWrite(p.id, p, () => db.collection('prospects').doc(p.id).set(body)); }
  else Local.saveSoon();
}
function removeProspect(id) {
  state.prospects.delete(id);
  if (state.mode === 'cloud' && db) cloudWrite(id, null, () => db.collection('prospects').doc(id).delete());
  else Local.saveSoon();
}
let settingsTimer = 0;
function saveSettings(soon) {
  clearTimeout(settingsTimer);
  const go = () => {
    if (state.mode === 'cloud' && db) { const body = clone(state.settings); cloudWrite('__settings', null, () => db.doc('config/settings').set(body)); }
    else Local.saveSoon();
  };
  if (soon) settingsTimer = setTimeout(go, 700); else go();
}

async function connectCloud() {
  const d = await cap('db');
  if (!d) { state.booting = false; state.mode = 'local'; render(); return; }
  db = d;
  state.mode = 'cloud';
  state.prospects = new Map();
  const local = Local.read();
  state.localStash = local && Array.isArray(local.prospects) && local.prospects.length ? local : null;
  const fallback = setTimeout(() => { if (state.booting) { state.booting = false; render(); } }, 12000);
  try {
    db.collection('prospects').onSnapshot((snap) => {
      const m = new Map();
      for (const d of snap.docs) { const data = d.data(); if (data) m.set(d.id, normProspect(Object.assign(clone(data), { id: d.id }))); }
      for (const [k, v] of pendingLocal) { if (k === '__settings') continue; if (v) m.set(k, v); else m.delete(k); }
      state.prospects = m;
      if (!snap.metadata || !snap.metadata.fromCache) state.cloudLoaded = true;
      state.booting = false;
      clearTimeout(fallback);
      render();
    }, onSyncError);
    db.doc('config/settings').onSnapshot((snap) => {
      if (snap.exists && !pendingLocal.has('__settings') && !chains.has('__settings')) {
        state.settings = mergeSettings(snap.data());
        refreshSettingsViews();
        render();
      }
    }, onSyncError);
  } catch (e) { onSyncError(e); }
}
function onSyncError() {
  state.syncError = true;
  state.booting = false;
  render();
  toast('Sync stopped. Reload the page to reconnect.');
}

/* ------------------------------------------------------------------ */
/* Helpers                                                             */
/* ------------------------------------------------------------------ */
const sod = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (t, n) => { const d = new Date(sod(t)); d.setDate(d.getDate() + n); return d.getTime(); };
const dayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtDate = (t) => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
function rel(t) {
  const d = Math.round((sod(t) - sod()) / DAY);
  if (d === 0) return 'today';
  if (d === -1) return 'yesterday';
  if (d === 1) return 'tomorrow';
  return d < 0 ? (-d) + ' days ago' : 'in ' + d + ' days';
}
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function fmtPhone(d) {
  d = String(d || '').replace(/\D/g, '');
  if (d.length === 11 && d[0] === '1') return '1 (' + d.slice(1, 4) + ') ' + d.slice(4, 7) + '-' + d.slice(7);
  return d.replace(/(\d{2,3})(?=(\d{3})+$)/g, '$1 ');
}
function handleLabel(p) {
  if (!p.handle) return 'No contact yet';
  if (p.platform === 'wa') return '+' + fmtPhone(p.handle);
  if (p.platform === 'fb') return /^\d+$/.test(p.handle) ? 'Page ' + p.handle : 'fb.com/' + p.handle;
  return '@' + p.handle;
}
const displayName = (p) => (p.name || '').trim() || handleLabel(p);
function chatLink(p, text) {
  const h = enc(p.handle || '');
  switch (p.platform) {
    case 'wa': return 'https://wa.me/' + String(p.handle || '').replace(/\D/g, '') + (text ? '?text=' + enc(text) : '');
    case 'ig': return 'https://ig.me/m/' + h;
    case 'fb': return 'https://m.me/' + h;
    case 'tt': return 'https://www.tiktok.com/@' + h;
  }
  return '#';
}
function profileLink(p) {
  const h = enc(p.handle || '');
  switch (p.platform) {
    case 'wa': return 'https://wa.me/' + String(p.handle || '').replace(/\D/g, '');
    case 'ig': return 'https://www.instagram.com/' + h + '/';
    case 'fb': return /^\d+$/.test(p.handle) ? 'https://www.facebook.com/profile.php?id=' + h : 'https://www.facebook.com/' + h;
    case 'tt': return 'https://www.tiktok.com/@' + h;
  }
  return '#';
}

function normPhone(raw, cc) {
  const s = String(raw || '').trim();
  if (/^\+/.test(s)) return s.replace(/\D/g, '');
  let d = s.replace(/\D/g, '');
  if (d.startsWith('00')) return d.slice(2);

  let contacted = 0, replies = 0, clients = 0;
  for (const p of state.prospects.values()) {
    if ((p.step || 0) >= 1 || ['replied', 'booked', 'client'].includes(p.stage)) contacted++;
    if (['replied', 'booked', 'client'].includes(p.stage) || (p.history || []).some((h) => h.a === 'replied')) replies++;
    if (p.stage === 'client') clients++;
  }
  const rate = contacted ? Math.round((replies / contacted) * 100) : 0;
  const upNext = items.filter((p) => !cur || p.id !== cur.id).slice(0, 7);
  return '<section class="panel" aria-label="Today\'s progress"><h3 class="panel-h">Today <span>' + esc(new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })) + '</span></h3>' +

      '<div><dt>Sent today</dt><dd>' + q.sent.n + '</dd></div>' +
      '<div><dt>Replies</dt><dd>' + replies + (contacted ? ' <small class="muted">· ' + rate + '%</small>' : '') + '</dd></div>' +
      '<div><dt>Clients</dt><dd>' + clients + '</dd></div>' +
    '</dl></section>' +
    chartHTML() +
    (upNext.length ? '<section class="panel"><h3 class="panel-h">Up next <span>' + items.length + ' in queue</span></h3><ol class="next">' +
      upNext.map((p) => '<li><button type="button" data-act="pick" data-id="' + esc(p.id) + '" class="p-' + p.platform + '"><span class="dot" aria-hidden="true"></span><span class="nm">' + esc(displayName(p)) + '<span class="sr"> on ' + esc(PLATFORMS[p.platform].label) + '</span></span><span class="sx">' + esc(STEP_LABEL[Math.min(p.step || 0, 2)]) + '</span></button></li>').join('') +
    '</ol></section>' : '') +
    '<section class="panel tips"><h3 class="panel-h">Keep your accounts safe</h3><ul>' +
      '<li>Stay around 20 to 30 new messages per account per day. Raise it slowly.</li>' +

    '</ul></section>';
}

function addPasted(e) {
  e.preventDefault();
  const f = currentFind();
  const plat = $('#p-plat').value;
  const lines = $('#p-text').value.split(/\r?\n/);
  let added = 0; const dups = [], bad = [];
  const seen = new Set();
  for (const line of lines) {
    const r = parseLine(line, plat, state.settings.cc);
    if (!r) continue;
    if (r.error) { bad.push(r.error); continue; }
    const k = dupKey(r);
    if (seen.has(k)) continue;
    seen.add(k);
    const dup = findDuplicate(r);
    if (dup) { dups.push(displayName(dup)); continue; }
    persist(newProspect({ platform: r.platform, handle: r.handle, name: r.name, first: r.first, note: r.note, trade: f.trade, city: f.city, signals: [] }));
    added++;
  }
  const out = $('#p-result');
  let html = '<div class="result">';
  html += '<b>' + (added ? 'Added ' + added + ' prospect' + (added > 1 ? 's' : '') + ' to your queue.' : 'Nothing new was added.') + '</b>';

  if (bad.length) html += '<span class="err-msg">' + bad.length + ' line' + (bad.length > 1 ? 's' : '') + ' had no link, username or number we could open:</span><ul>' + bad.slice(0, 6).map((b) => '<li>' + esc(b) + '</li>').join('') + (bad.length > 6 ? '<li>and ' + (bad.length - 6) + ' more</li>' : '') + '</ul>';

  html += '</div>';
  out.innerHTML = html;
  if (added) $('#p-text').value = bad.join('\n');
  renderChrome();
}

/* Import / export --------------------------------------------------- */
function toCSV(rows) { return rows.map((r) => r.map((v) => { const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n'); }
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}
function prospectsCSV() {
  const head = ['business', 'first_name', 'platform', 'handle', 'trade', 'city', 'status', 'messages_sent', 'last_message', 'next_follow_up', 'fit_score', 'fit_signals', 'noticed', 'notes', 'chat_link'];
  const rows = Array.from(state.prospects.values()).sort((a, b) => a.createdAt - b.createdAt).map((p) => [
    p.name, p.first, PLATFORMS[p.platform].label, p.platform === 'wa' ? '+' + p.handle : p.handle, TRADES[p.trade].label, p.city, statusOf(p).label, p.step || 0,
    p.lastAt ? dayKey(p.lastAt) : '', p.stage === 'active' && p.nextAt ? dayKey(p.nextAt) : '', (p.signals || []).length ? scoreOf(p) : '', (p.signals || []).join(' '), p.note, p.notes, chatLink(p, '')
  ]);
  return toCSV([head].concat(rows));
}
async function offerFile(filename, text, mime) {
  const dl = await cap('downloads');
  if (dl) {
    try { await dl.save({ filename, data: text }); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    if (hasRuntime) toast('If no file appeared, use Copy as CSV instead.');
  } catch (e) { toast('Downloads are blocked here. Use Copy as CSV instead.'); }
}
function importText(name, text) {
  const out = $('#s-import-result');
  let added = 0, updated = 0, skipped = 0;
  try {
    if (/\.json$/i.test(name) || /^\s*\{/.test(text)) {
      const data = JSON.parse(text);
      const list = Array.isArray(data) ? data : data.prospects;
      if (!Array.isArray(list)) throw new Error('no prospects');
      for (const raw of list) {
        if (!raw || !raw.handle) { skipped++; continue; }
        const p = normProspect(Object.assign({}, raw, { id: raw.id && /^[A-Za-z0-9_\-.~:@+]{1,80}$/.test(raw.id) ? raw.id : uid() }));
        const dup = findDuplicate(p, p.id);
        if (dup) { skipped++; continue; }
        if (state.prospects.has(p.id)) updated++; else added++;
        persist(p);
      }
      if (data.settings && !Array.isArray(data)) { state.settings = mergeSettings(data.settings); saveSettings(false); }
    } else {
      const rows = parseCSV(text);
      if (rows.length < 2) throw new Error('empty');
      const head = rows[0].map((h) => h.trim().toLowerCase().replace(/[\s-]+/g, '_'));
      const col = (...names) => head.findIndex((h) => names.includes(h));
      const iName = col('business', 'name', 'company', 'business_name'), iFirst = col('first_name', 'first', 'contact', 'owner');
      const iPlat = col('platform', 'channel', 'source'), iTrade = col('trade', 'niche', 'industry', 'category'), iCity = col('city', 'location', 'area');
      const iNote = col('noticed', 'note'), iNotes = col('notes', 'comments');
      const linkCols = head.map((h, i) => (/handle|username|link|url|profile|phone|whatsapp|instagram|facebook|tiktok|number/.test(h) ? i : -1)).filter((i) => i >= 0);
      for (const r of rows.slice(1)) {
        const plat = platformFromText(iPlat >= 0 ? r[iPlat] : '') || 'ig';
        let c = null;
        for (const i of linkCols) { const v = (r[i] || '').trim(); if (!v) continue; const hint = platformFromText(head[i]) || plat; c = parseContact(v, hint, state.settings.cc); if (c) break; }
        if (!c) { skipped++; continue; }
        if (findDuplicate(c)) { skipped++; continue; }
        const trade = tradeFromText(iTrade >= 0 ? r[iTrade] : '') || currentFind().trade;
        persist(newProspect({ platform: c.platform, handle: c.handle, name: (iName >= 0 ? r[iName] : '').trim() || nameFromHandle(c), first: (iFirst >= 0 ? r[iFirst] : '').trim(), trade, city: (iCity >= 0 ? r[iCity] : '').trim(), note: (iNote >= 0 ? r[iNote] : '').trim(), notes: (iNotes >= 0 ? r[iNotes] : '').trim(), signals: [] }));
        added++;
      }
    }
    out.className = 'ok-msg';
    out.textContent = 'Imported ' + added + ' new' + (updated ? ', updated ' + updated : '') + (skipped ? ', skipped ' + skipped + ' (duplicates or no contact)' : '') + '.';
    render();
  } catch (e) {
    out.className = 'err-msg';
    out.textContent = 'That file could not be read. Use a CSV with a header row and a link, username or phone column, or a backup from this tool.';
  }
}

  if (!el) {
    const row = e.target.closest('tr[data-row]');
    if (row) openDrawer(row.dataset.row);
    return;
  }
  const act = el.dataset.act;
  const cur = currentProspect();
  switch (act) {
    case 'open': {
      if (!cur) { e.preventDefault(); return; }
      const text = ($('#msg') || {}).value || '';
      if (cur.platform === 'wa') el.href = chatLink(cur, text);
      copyText(text);
      const id = cur.id;
      setTimeout(() => markSent(id, cur.platform !== 'wa'), 80);
      return;
    }
    case 'sentonly': if (cur) markSent(cur.id, false); return;
    case 'replied': if (cur) { const id = cur.id; setStage(id, 'replied', '', displayName(cur) + ' marked as replied.'); openDrawer(id); } return;
    case 'notfit': if (cur) setStage(cur.id, 'closed', 'notfit', displayName(cur) + ' closed as not a fit.'); return;
    case 'skip': if (cur) skipToday(cur.id); return;
    case 'variant': {
      if (!cur) return;
      const d = draftFor(cur);
      d.bump = (d.bump || 0) + 1;
      d.text = messageFor(cur, d.bump);
      const ta = $('#msg'); if (ta) ta.value = d.text;
      syncMsg();
      return;
    }
    case 'pick': state.currentId = el.dataset.id; renderToday(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
    case 'plat': state.platFilter = el.dataset.v; state.currentId = null; saveUI(); renderToday(); return;
    case 'more': {
      const s = state.settings, k = dayKey();
      s.extra = { day: k, n: (s.extra && s.extra.day === k ? +s.extra.n || 0 : 0) + 10 };
      saveSettings(false); render(); return;
    }
    case 'tab': show(el.dataset.v); return;
    case 'new': openDrawer(null); return;
    case 'edit': e.stopPropagation(); openDrawer(el.dataset.id); return;
    case 'undo': doUndo(); return;
    case 'migrate': {
      const stash = state.localStash; if (!stash) return;
      let n = 0;
      for (const raw of stash.prospects) { if (raw && raw.id && !state.prospects.has(raw.id)) { persist(normProspect(raw)); n++; } }
      try { localStorage.setItem(LS_KEY + '-moved', JSON.stringify(stash)); localStorage.removeItem(LS_KEY); } catch (err) {}
      state.localStash = null;
      toast('Moved ' + n + ' prospects to your synced list.');
      render(); return;
    }
    case 'lfilter': state.listFilter = el.dataset.v; renderList(); return;
    case 'close': closeDrawer(); return;
    case 'delete': deleteFromDrawer(el); return;
    case 'copyreply': {
      const t = ($('#dr-' + el.dataset.i) || {}).textContent || '';
      copyText(t).then(() => toast('Reply copied.'));
      return;
    }
    case 'copyreplym': {
      const r = state.settings.replies[+el.dataset.i];
      if (r) copyText(fill(r.text, varsFor(previewProspect()))).then(() => toast('Reply copied with the preview details. Edit names before sending.'));
      return;
    }
    case 'addvar': { const k = el.dataset.k; state.settings.tpl[k].push(''); saveSettings(false); renderMessages(); const ta = $('#tpl-' + k + '-' + (state.settings.tpl[k].length - 1)); if (ta) ta.focus(); return; }
    case 'rmvar': { const k = el.dataset.k; state.settings.tpl[k].splice(+el.dataset.i, 1); saveSettings(false); state.drafts.clear(); renderMessages(); return; }
    case 'resettpl': {
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Click again to reset every message'; setTimeout(() => { if (el.isConnected) { el.classList.remove('armed'); el.textContent = 'Reset all messages to the defaults'; } }, 4000); return; }
      state.settings.tpl = clone(DEFAULTS.tpl); state.settings.replies = clone(DEFAULTS.replies);
      saveSettings(false); state.drafts.clear(); renderMessages(); toast('Messages reset to the defaults.'); return;
    }
    case 'export-csv': offerFile('prospects-' + dayKey() + '.csv', prospectsCSV(), 'text/csv'); return;
    case 'copy-csv': copyText(prospectsCSV()).then((ok) => toast(ok === false ? 'Copy was blocked. Try Download CSV.' : 'Copied ' + state.prospects.size + ' prospects as CSV.')); return;
    case 'export-json': offerFile('toma-outreach-backup-' + dayKey() + '.json', JSON.stringify({ app: 'toma-outreach', version: 1, exportedAt: new Date().toISOString(), settings: state.settings, prospects: Array.from(state.prospects.values()) }, null, 1), 'application/json'); return;
    case 'clearall': {
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Click again to delete ' + state.prospects.size + ' prospects'; setTimeout(() => { if (el.isConnected) { el.classList.remove('armed'); el.textContent = 'Delete all prospects'; } }, 4000); return; }
      for (const id of Array.from(state.prospects.keys())) removeProspect(id);
      state.drafts.clear(); renderSettings(); render(); toast('All prospects deleted.'); return;
    }
  }
});

function syncMsg() {
  const ta = $('#msg'), cur = currentProspect();
  if (!ta || !cur) return;
  const d = draftFor(cur); d.text = ta.value;
  const c = $('#msg-count'); if (c) c.textContent = ta.value.length + ' characters';
  const b = $('#openBtn'); if (b && cur.platform === 'wa') b.href = chatLink(cur, ta.value);
}
let tplPreviewTimer = 0;
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'msg') { syncMsg(); return; }
  if (t.id === 'l-search') { state.search = t.value; renderList(); return; }
  if (t.id === 'f-city' || t.id === 'f-term') { saveUI({ fCity: $('#f-city').value, fTerm: ($('#f-term') || {}).value || '' }); renderSources(); renderPasteTarget(); return; }
  if (t.dataset.tpl) {
    state.settings.tpl[t.dataset.tpl][+t.dataset.i] = t.value;
    clearTimeout(tplPreviewTimer);
    tplPreviewTimer = setTimeout(() => { const pv = $('#pv-' + t.dataset.tpl + '-' + t.dataset.i); if (pv) pv.textContent = fill(t.value, varsFor(previewProspect())); }, 120);
    state.drafts.clear(); saveSettings(true); return;
  }
  if (t.dataset.reply) { state.settings.replies[+t.dataset.reply].text = t.value; saveSettings(true); return; }
  if (t.dataset.replyLabel) { state.settings.replies[+t.dataset.replyLabel].label = t.value; saveSettings(true); return; }
  if (t.dataset.set) {
    const k = t.dataset.set;
    if (['dailyNew', 'fu1', 'fu2'].includes(k)) { const v = Math.round(+t.value); if (!Number.isFinite(v) || v < 1) return; state.settings[k] = v; }
    else if (k === 'cc') state.settings.cc = t.value.replace(/\D/g, '');
    else state.settings[k] = t.value.trim();
    state.drafts.clear(); saveSettings(true); renderChrome(); return;
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'f-trade') {
    const wrap = $('#f-term-wrap'); if (wrap) wrap.hidden = t.value !== 'other';
    $$('input[name="a-sig"][value="ticket"]').forEach((x) => { x.checked = !!TRADES[t.value].high; });
    saveUI({ fTrade: t.value }); renderSources(); renderPasteTarget(); return;
  }
  if (t.id === 'a-plat' || t.id === 'p-plat') { saveUI({ fPlat: t.value }); return; }
  if (t.id === 'l-plat') { state.listPlat = t.value; renderList(); return; }
  if (t.id === 'd-status') { const nd = $('#d-next'); if (nd) { nd.disabled = t.value !== 'active'; if (t.value === 'active' && !nd.value) nd.value = toDateInput(addDays(Date.now(), +state.settings.fu1 || 3)); } return; }
  if (t.id === 'd-contact') { const c = parseContact(t.value, $('#d-plat').value, state.settings.cc); if (c) $('#d-plat').value = c.platform; return; }
  if (t.id === 's-import' && t.files && t.files[0]) {
    const file = t.files[0];
    const r = new FileReader();
    r.onload = () => { importText(file.name, String(r.result || '')); t.value = ''; };
    r.readAsText(file);
    return;
  }
  if (t.dataset.set) { if (state.view === 'settings') saveSettings(false); }
});
document.addEventListener('submit', (e) => {
  if (e.target.id === 'add-one') return addOne(e);
  if (e.target.id === 'paste') return addPasted(e);
  if (e.target.id === 'd-form') { e.preventDefault(); saveDrawer(); }
});
document.addEventListener('keydown', (e) => {
  if (state.view !== 'today' || state.booting) return;
  const dlg = $('#drawer');
  if (dlg && dlg.open) return;
  const t = e.target;
  if (t && t.id === 'msg') {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); const b = $('#openBtn'); if (b) b.click(); }
    return;
  }
  if (t && t.closest && t.closest('input,textarea,select,[contenteditable="true"]')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'enter') {
    if (t && t.closest && t.closest('button,a')) return;
    const b = $('#openBtn'); if (b) { e.preventDefault(); b.click(); }
  } else if (k === 's') { const c = currentProspect(); if (c) skipToday(c.id); }
  else if (k === 'r') { const c = currentProspect(); if (c) { const id = c.id; setStage(id, 'replied', '', displayName(c) + ' marked as replied.'); openDrawer(id); } }
  else if (k === 'x') { const c = currentProspect(); if (c) setStage(c.id, 'closed', 'notfit', displayName(c) + ' closed as not a fit.'); }
  else if (k === 'u' || (k === 'z' && state.undo)) doUndo();
});
$('#drawer').addEventListener('close', () => { if (state.view === 'today') renderToday(); });
$('#drawer').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeDrawer(); });
window.addEventListener('focus', () => { if (state.view === 'today' && !state.booting) renderToday(); });

/* ------------------------------------------------------------------ */
/* Boot                                                                */
/* ------------------------------------------------------------------ */
function boot() {
  loadUI();
  const local = Local.read();
  if (local) {
    state.settings = mergeSettings(local.settings);
    if (Array.isArray(local.prospects)) for (const p of local.prospects) if (p && p.id) state.prospects.set(p.id, normProspect(p));
  }
  const hashView = (location.hash || '').slice(1);
  if (['today', 'find', 'list', 'messages', 'settings'].includes(hashView)) state.view = hashView;
  show(state.view);
  if (hasRuntime) connectCloud();
}
boot();
})();
</script>
