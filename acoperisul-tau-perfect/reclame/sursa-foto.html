<!doctype html><html lang="ro"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
.ad{width:1080px;height:1350px;background:#2B3440;color:#fff;font-family:"Plus Jakarta Sans",sans-serif;display:flex;flex-direction:column}
.top{height:150px;padding:0 80px;display:flex;justify-content:space-between;align-items:center}
.top img{height:76px}.area{font-size:30px;font-weight:600;color:#C9D1DB}
.photo{height:720px;background-size:cover;background-position:center}
.text{flex:1;padding:44px 80px 0}
h1{font-size:76px;line-height:1.05;font-weight:800;letter-spacing:-1px}
h1 em{font-style:normal;color:#E08A45}
p{font-size:36px;font-weight:500;color:#DCE2E9;margin-top:18px}
.bar{background:#E08A45;color:#1E252E;padding:36px 80px;font-size:44px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.bar span{font-size:32px;font-weight:600}
</style></head><body>
<div class="ad" id="f1">
 <div class="top"><img src="../brand/logo-alb.png"><div class="area">București și Ilfov</div></div>
 <div class="photo" style="background-image:url(foto-stoc-1-dekarze.jpg)"></div>
 <div class="text"><h1>Acoperiș nou sau <em>reparații?</em></h1><p>Ne ocupăm de tot, de la evaluare la ultima țiglă.</p></div>
 <div class="bar">Cereți o ofertă →<span>5 secunde</span></div>
</div>
<div class="ad" id="f2">
 <div class="top"><img src="../brand/logo-alb.png"><div class="area">București și Ilfov</div></div>
 <div class="photo" style="background-image:url(foto-stoc-2-tigla.jpg)"></div>
 <div class="text"><h1>Schimbați acoperișul <em>înainte de iarnă.</em></h1><p>Țiglă, tablă, jgheaburi, mansarde.</p></div>
 <div class="bar">Cereți o ofertă →<span>5 secunde</span></div>
</div>
</body></html>
